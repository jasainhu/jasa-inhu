<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Kak Inhu 2D Flat Vector Mascot Avatar -->
  <defs>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="vGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="vSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
  </defs>

  <!-- Lingkaran Dasar Avatar (Flat Emerald Background) -->
  <circle cx="50" cy="50" r="48" fill="#044e42" />

  <!-- Kerah Baju Melayu Hijau -->
  <path d="M 28 88 C 34 82, 66 82, 72 88 L 74 98 L 26 98 Z" fill="#0d9488" />
  <path d="M 45 84 L 50 89 L 55 84" stroke="url(#vGold)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Leher -->
  <rect x="42" y="72" width="16" height="13" rx="4" fill="#fcd34d" />

  <!-- Telinga -->
  <circle cx="26" cy="62" r="5.5" fill="#fcd34d" />
  <circle cx="74" cy="62" r="5.5" fill="#fcd34d" />

  <!-- Kepala / Wajah Vektor Bulat Bersih -->
  <ellipse cx="50" cy="61" rx="23" ry="22" fill="url(#vSkin)" />

  <!-- Rambut Samping Tipis -->
  <path d="M 27 54 C 29 58, 31 64, 30 67" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 73 54 C 71 58, 69 64, 70 67" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />

  <!-- Alis Vektor -->
  <path d="M 37 53 Q 42 50 46 53" stroke="#334155" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 63 53 Q 58 50 54 53" stroke="#334155" stroke-width="2.2" stroke-linecap="round" />

  <!-- Mata Berbinar Ramah -->
  <ellipse cx="41" cy="59" rx="3.5" ry="4.5" fill="#0f172a" />
  <ellipse cx="59" cy="59" rx="3.5" ry="4.5" fill="#0f172a" />
  <circle cx="42" cy="57.5" r="1.4" fill="#ffffff" />
  <circle cx="60" cy="57.5" r="1.4" fill="#ffffff" />

  <!-- Pipi Merona Halus -->
  <circle cx="34" cy="65" r="3.5" fill="#f87171" opacity="0.45" />
  <circle cx="66" cy="65" r="3.5" fill="#f87171" opacity="0.45" />

  <!-- Hidung Minimalis -->
  <path d="M 49 62 Q 50 64 51 62" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" />

  <!-- Senyum Ramah -->
  <path d="M 42 68 Q 50 76 58 68" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.5" />
  <path d="M 44.5 68.5 Q 50 71 55.5 68.5" fill="#ffffff" />

  <!-- TANJAK MELAYU (Khas Riau) -->
  <!-- Puncak Tanjak Menjulang -->
  <path d="M 26 44 C 30 26, 44 11, 68 7 C 62 19, 67 30, 75 40 C 60 40, 42 42, 26 44 Z" fill="url(#vGreen)" />
  <path d="M 32 34 C 41 20, 54 11, 68 7 C 63 18, 66 26, 72 36 Z" fill="#134e4a" opacity="0.75" />

  <!-- Simpul Kiri Emas -->
  <path d="M 26 44 C 18 36, 16 26, 22 18 C 25 26, 27 35, 30 42 Z" fill="url(#vGold)" />

  <!-- Balutan Kain Songket Emas Depan -->
  <path d="M 23 48 C 34 43, 66 43, 77 48 C 75 53, 72 55, 68 56 C 50 53, 36 53, 25 56 C 23 54, 22 51, 23 48 Z" fill="url(#vGold)" />
  
  <!-- Bros Emas Bulan Sabit Tanjak di Tengah -->
  <circle cx="50" cy="49" r="4.2" fill="#ffffff" />
  <circle cx="50" cy="49" r="3.2" fill="url(#vGold)" />
  <circle cx="50" cy="49" r="1.5" fill="#92400e" />
</svg>
