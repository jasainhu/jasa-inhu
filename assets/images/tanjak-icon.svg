<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Tanjak Melayu Riau - Icon Vektor Mewah & Bersih (Modern Dual-Tone) -->
  <defs>
    <linearGradient id="tanjakGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="tanjakWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- 1. Pucuk / Daun Tanjak Menjulang Tinggi (Khas Melayu Riau) -->
    <path d="M 18 36 C 20 22, 28 10, 44 6 C 40 16, 44 24, 50 32 C 40 32, 29 33, 18 36 Z" 
          fill="url(#tanjakWhite)" stroke="rgba(255,255,255,0.8)" stroke-width="0.8" />

    <!-- 2. Lapisan Bayangan Lipatan Belakang (Dimensi Kedalaman) -->
    <path d="M 24 28 C 30 18, 38 12, 44 6 C 41 14, 44 21, 48 29 Z" 
          fill="#cbd5e1" opacity="0.8" />

    <!-- 3. Sayap Simpul Kiri (Kancing Simpul Tanjak) -->
    <path d="M 18 36 C 13 30, 10 23, 14 18 C 17 23, 19 29, 21 34 Z" 
          fill="url(#tanjakGold)" />

    <!-- 4. Tebing / Lipatan Tengah Bertingkat (Kain Songket Melayu) -->
    <path d="M 16 38 C 26 34, 38 33, 52 36 L 51 41 C 36 38, 25 39, 15 43 Z" 
          fill="url(#tanjakGold)" />

    <!-- 5. Balutan Ikat Kepala Utama (Base Band Songket) -->
    <path d="M 11 44 C 22 40, 42 39, 55 43 C 54 48, 51 52, 48 54 C 35 51, 23 51, 14 54 C 12 51, 10 48, 11 44 Z" 
          fill="url(#tanjakWhite)" />

    <!-- 6. Garis Bordir Emas Tenun Melayu -->
    <path d="M 14 49 C 25 46, 39 46, 48 49" 
          stroke="url(#tanjakGold)" stroke-width="1.6" stroke-linecap="round" />

    <!-- 7. Bros / Lambang Bulan Bintang Emas Tanjak di Tengah -->
    <circle cx="32" cy="46" r="4.2" fill="url(#tanjakGold)" />
    <circle cx="32" cy="46" r="2.6" fill="#ffffff" />
    <circle cx="32" cy="46" r="1.3" fill="#b45309" />
  </g>
</svg>
